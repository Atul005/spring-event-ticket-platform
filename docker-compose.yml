services:
  db:
    image: postgres:latest
    ports:
      - "5433:5432"
    restart: always
    container_name: tickets-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: event_ticketing
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
    volumes:
      - tickets-db-data:/var/lib/postgresql


  adminer:
    image: adminer:latest
    restart: always
    container_name: tickets-adminer
    ports:
      - "8888:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev
      - --db=dev-file
    ports:
      - "9090:8080"  # Keycloak admin console
    restart: always
    container_name: tickets-keycloak
    volumes:
      - keycloak-data:/opt/keycloak/data


volumes:
  keycloak-data:
    driver: local
  tickets-db-data:
