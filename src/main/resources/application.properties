spring.application.name=tickets


# PostgreSQL DB connection
spring.datasource.url=jdbc:postgresql://localhost:5433/event_ticketing
spring.datasource.username=postgres
spring.datasource.password=postgres123

# JPA / Hibernate settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


spring.security.oauth2.resourceserver.jwt.issuer-url=http://localhost:9090/realms/event-ticket-platform
